# filminibul: API ve Postgres yalnız sunucu içinden erişilebilir.
# Docker yayınladığı portlarda ufw kurallarını atladığı için dışarı açılmamalı.
services:
  api-gw:
    ports: !override
      - 127.0.0.1:8000:8000/tcp
  supavisor:
    ports: !override
      - 127.0.0.1:5432:5432
      - 127.0.0.1:6543:6543
