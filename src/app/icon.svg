<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0f0f23"/>
  <!-- Film icon (simplified camera/film) -->
  <g fill="url(#grad)">
    <!-- Film strip body -->
    <rect x="7" y="10" width="18" height="12" rx="2"/>
    <!-- Film holes left -->
    <rect x="5" y="11" width="2" height="2" rx="0.5" fill="#0f0f23"/>
    <rect x="5" y="15" width="2" height="2" rx="0.5" fill="#0f0f23"/>
    <rect x="5" y="19" width="2" height="2" rx="0.5" fill="#0f0f23"/>
    <!-- Film holes right -->
    <rect x="25" y="11" width="2" height="2" rx="0.5" fill="#0f0f23"/>
    <rect x="25" y="15" width="2" height="2" rx="0.5" fill="#0f0f23"/>
    <rect x="25" y="19" width="2" height="2" rx="0.5" fill="#0f0f23"/>
    <!-- Play triangle -->
    <polygon points="14,13 14,19 19,16" fill="#0f0f23"/>
  </g>
</svg>
