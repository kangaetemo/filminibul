name: Film açıklamalarını ve afişleri düzenle
on:
  push:
    branches: [main]
    paths: [scripts/catalog/refresh_content.mjs, scripts/catalog/translate_overview.mjs]
  workflow_dispatch:
    inputs:
      max_films:
        description: "İşlenecek en fazla film (ilk tam tarama: 30000)"
        default: "30000"
      skip_translation:
        description: "OpenAI çağrısı yapmadan yalnızca metin temizliği / afiş bakımı"
        type: boolean
        default: false
      retry_failed:
        description: "Yalnızca önceki rapordaki eksik / hatalı filmler"
        type: boolean
        default: false
      max_usd:
        description: "Bu çalışma için onaylanmış azami çeviri bütçesi (USD; 0 = ücretli çeviri yok)"
        default: "0"
  schedule:
    - cron: "0 4 * * 2"
concurrency:
  group: catalog-maintenance
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAX_FILMS: ${{ inputs.max_films || '30000' }}
      MAX_TRANSLATION_USD: ${{ inputs.max_usd || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: data/content/checked.json
          key: content-audit-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: content-audit-
      - name: Türkçe metinleri tamamla ve orijinal afişleri seç
        env:
          METADATA_ONLY: ${{ github.event_name == 'push' || inputs.skip_translation == true }}
          RETRY_FAILED: ${{ github.event_name == 'push' || inputs.retry_failed == true }}
        run: |
          args=(--max="$MAX_FILMS")
          if [ "$METADATA_ONLY" = "true" ]; then args+=(--skip-translation); fi
          if [ "$RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          node scripts/catalog/refresh_content.mjs "${args[@]}"
      - name: Kontrol önbelleğini hata durumunda da sakla
        if: always() && hashFiles('data/content/checked.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/content/checked.json
          key: content-audit-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-maintenance-report
          path: docs/content-maintenance-report.json
      - name: Raporu commit et
        if: always()
        run: |
          if [ ! -f docs/content-maintenance-report.json ]; then exit 0; fi
          git add docs/content-maintenance-report.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git commit -m "docs: film içerik düzenleme raporu"
          git pull --rebase origin main
          git push
      - name: Katalog önbelleğini yenile
        if: always()
        run: node scripts/catalog/revalidate_content.mjs
