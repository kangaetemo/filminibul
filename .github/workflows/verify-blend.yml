name: Karıştır önerilerini doğrula
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-blend.yml
      - scripts/catalog/verify_blend.mjs
      - src/lib/recommend/blend.ts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blend-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
      - name: Matrix + Amélie normal ve zaman aşımı kurtarma
        run: node scripts/catalog/verify_blend.mjs
        env:
          NODE_OPTIONS: --no-experimental-require-module
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Rapor
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blend-verification-report
          path: docs/blend-verification-report.json
