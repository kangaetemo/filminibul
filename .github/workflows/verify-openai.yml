name: OpenAI erişimini küçük çağrılarla doğrula
on:
  push:
    branches: [verify/openai-credit-20261015]
    paths:
      - .github/workflows/verify-openai.yml
      - scripts/catalog/verify_openai.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openai-credit-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tek chat ve embedding isteği, tekrar yok
        run: node scripts/catalog/verify_openai.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Yalnız güvenli ölçüm raporu
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openai-verification-report
          path: docs/openai-verification-report.json
